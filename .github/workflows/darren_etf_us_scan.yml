# ============================================================
# 데런식 US ETF 스캔 — GitHub Actions 워크플로우
# ============================================================
# 저장 위치: .github/workflows/darren_etf_us_scan.yml
#
# 실행 시각: 매주 토요일 00:15 UTC = 한국시간 토요일 09:15
#           (US 주식 스캔 09:00 KST 바로 뒤 — 필요하면 시각 조정 가능)
# 수동 실행: Actions 탭 → Run workflow, 또는 텔레그램 "🇺🇸 US ETF" 버튼
#
# US는 유니버스가 5,389종목(인버스 제외)이라 배치 다운로드에 시간이
# 꽤 걸린다. KR ETF와 완전히 분리했으므로 한쪽이 오래 걸려도
# 다른 쪽 결과 도착 시간에 영향 없음.
#
# 사전 준비(저장소 최상위): darren_core.py, darren_etf_scan.py, us_etfs.csv,
#                          send_etf_buttons.py
# ============================================================

name: Darren US ETF Scan

on:
  schedule:
    - cron: "15 0 * * 6"   # 매주 토요일 00:15 UTC (KST 토요일 09:15)
  workflow_dispatch:

permissions:
  contents: write           # state/ 커밋용

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install yfinance pandas numpy requests

      - name: US ETF 스캔 실행
        run: |
          mkdir -p state
          python darren_etf_scan.py --market us --datadir . \
            --min-tier B --top 60 \
            --csv state/etf_scan --json state/etf_payload_us.json

      - name: 텔레그램 US ETF 메뉴 전송
        env:
          DARREN_TG_TOKEN: ${{ secrets.DARREN_TG_TOKEN }}
          DARREN_TG_CHAT: ${{ secrets.DARREN_TG_CHAT }}
          MARKET: US
        run: python send_etf_buttons.py

      - name: 상태 파일 커밋 (드릴다운용)
        run: |
          if [ ! -f "state/etf_payload_us.json" ]; then
            echo "페이로드 없음 - 커밋 생략"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "변경 없음 - 커밋 생략"
          else
            git commit -m "chore: US ETF 스캔 $(date -u +%F) [skip ci]"
            git push || (git pull --rebase && git push)
          fi

      - name: 결과 CSV 아티팩트 업로드 (30일 보관)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darren-etf-us-scan-csv
          path: state/etf_scan_us_etf.csv
          retention-days: 30
          if-no-files-found: ignore
